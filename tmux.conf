unbind C-b
unbind C-a
run-shell 'if [ -x "$HOME/bin/tmux-prefix-key" ]; then "$HOME/bin/tmux-prefix-key"; elif [ -x "$HOME/dot/bin/tmux-prefix-key" ]; then "$HOME/dot/bin/tmux-prefix-key"; fi'
set -ag update-environment " SSH_CONNECTION SSH_CLIENT SSH_TTY TMUX_PREFIX_KEY"
set-hook -g client-attached 'run-shell "if [ -x \"$HOME/bin/tmux-prefix-key\" ]; then \"$HOME/bin/tmux-prefix-key\"; elif [ -x \"$HOME/dot/bin/tmux-prefix-key\" ]; then \"$HOME/dot/bin/tmux-prefix-key\"; fi"'

set -g default-shell $SHELL
# set -g default-command "reattach-to-user-namespace -l ${SHELL}"

source-file $HOME/.config/tmux-status.conf
run-shell 'if [ -x "$HOME/bin/tmux-prefix-key" ]; then "$HOME/bin/tmux-prefix-key"; elif [ -x "$HOME/dot/bin/tmux-prefix-key" ]; then "$HOME/dot/bin/tmux-prefix-key"; fi'

setw -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys emacs
set -g focus-events on

set -g pane-border-status bottom
set -g pane-border-format "#P"

bind-key 1 select-pane -t 1 
bind-key 2 select-pane -t 2
bind-key 3 select-pane -t 3
bind-key 4 select-pane -t 4
bind-key 5 select-pane -t 5
bind-key 6 select-pane -t 6
bind-key 7 select-pane -t 7
bind-key 8 select-pane -t 8

bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "tmux-256color"
# tell Tmux that outside terminal supports true color
set -sa terminal-overrides ",xterm-256color:RGB"

# set-option default-terminal "xterm-256color"
# set-option -ga terminal-overrides ",xterm-256color:Tc"

# Same as default rename, except current name isn't prefilled
bind-key , command-prompt "rename-window '%%'"

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

set -s escape-time 0 # fast command sequences
set -sg repeat-time 600

set -g history-limit 50000 # boost history
###
## Navigation
###

set -g display-panes-time 2000
bind d display-panes -d 0

# panes start at 1
set -g base-index 1
set -g pane-base-index 1

bind c new-window -n '' -c '#{pane_current_path}'
bind C-l next-window
bind C-h last-window

# Prefix pane navigation/splitting to mirror muscle memory in cmux and tmux
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind a split-window -h -c "#{pane_current_path}"

set -g mouse on

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind - resize-pane -U 2
bind _ resize-pane -U 24
bind = resize-pane -D 2
bind + resize-pane -D 24
bind 9 resize-pane -L 6
bind ( resize-pane -L 24
bind 0 resize-pane -R 6
bind ) resize-pane -R 24

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# Uses tmux-native format matching (tmux 3.1+) instead of ps|grep
bind-key -n 'C-h' if-shell -F '#{m/r:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F '#{m/r:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F '#{m/r:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F '#{m/r:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\\' if-shell -F '#{m/r:(^|\/)g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}' 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R


###
## Plugins
###
# Supports `github_username/repo` or full git URLs
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux-plugins/'
set -g @tpm_plugins " \
  tmux-plugins/tmux-prefix-highlight \
  tmux-plugins/tpm \
  tmux-plugins/tmux-battery \
  tmux-plugins/tmux-yank \
  tmux-plugins/tmux-cpu \
  tmux-plugins/tmux-sessionist \
  tmux-plugins/tmux-open \
  yardnsm/tmux-1password \
  tmux-plugins/tmux-continuum \
  tmux-plugins/tmux-resurrect \
"

set -g @1password-copy-to-clipboard 'on'
set -g @continuum-restore 'on'
set -g @urlview-key 'x'

# Initializes TMUX plugin manager.
# Keep this line at the very bottom of tmux.conf.
run-shell $HOME/.config/tmux-plugins/tpm/tpm
